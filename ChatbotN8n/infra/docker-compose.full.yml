version: '3.8'

# ==============================================================================
# CFC AI & ZeO Chatbot — Full Stack Docker Compose
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Redis Stack (Vector Database & Session Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis/redis-stack-server:latest
    container_name: zeo-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_ARGS: >-
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. n8n I/O Gateway
  # ----------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: zeo-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=n8n.dinhduongcantho.io.vn
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.dinhduongcantho.io.vn/
      - N8N_EDITOR_BASE_URL=https://n8n.dinhduongcantho.io.vn
    volumes:
      - n8n-data:/home/node/.n8n

  # ----------------------------------------------------------------------------
  # 3. Cloudflared Tunnel (Quản lý domain n8n & FastAPI)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zeo-cloudflared
    restart: unless-stopped
    command: tunnel run n8n-dinhduongcantho
    network_mode: host
    # Nếu dùng credentials file, mount ~/.cloudflared vào container:
    # volumes:
    #   - ~/.cloudflared:/etc/cloudflared

volumes:
  redis-data:
  n8n-data:
